syntax = "proto2";

package autox.common;

import "safety_level.proto";
import "error_code.proto";

option cc_enable_arenas = true;

message PerformanceStats {
  optional double start_time = 1;

  // end_time is very close to timestamp_sec in header
  // to keep integrity of PerformanceStats
  // still keep end_time in PerformanceStats
  optional double end_time = 2;

  // delta_time = (start_time - prev_start_time)
  optional double delta_time = 3;

  // total cpu_time used  
  optional double cpu_time_used = 4;

  // attributes below are for future use
  optional uint32 allocation_count = 5;

  optional uint64 bytes_allocated = 6;

  optional uint32 deallocation_count = 7;

  optional uint64 bytes_deallocated = 8;

  optional uint64 perfstats_frame_identifier = 9;

  optional double point_cloud_transition_time = 10;
}

message Header {
  // Message publishing time in seconds. It is recommended to obtain
  // timestamp_sec from ros::Time::now(), right before calling
  // SerializeToString() and publish().
  optional double timestamp_sec = 1;

  // Module name.
  optional string module_name = 2;

  // Sequence number for each message. Each module maintains its own counter for
  // sequence_num, always starting from 1 on boot.
  optional uint32 sequence_num = 3;

  // Lidar Sensor timestamp for nano-second.
  optional uint64 lidar_timestamp = 4;

  // Camera Sensor timestamp for nano-second.
  optional uint64 camera_timestamp = 5;

  // Radar Sensor timestamp for nano-second.
  optional uint64 radar_timestamp = 6;

  // Sensor expected measurement time in one period for millisecond.
  optional uint32 expected_measurement_ms = 13;

  // data version
  optional uint32 version = 7 [default = 1];

  optional StatusPb status = 8;

  optional string frame_id = 9;

  optional PerformanceStats performance_stats = 10;

  optional uint32 num_frames_lidar_data_unavailable = 11 [default = 1];

  optional autox.xrt.safety.proto.SafetyLevel safety_level = 12 [default = MRC1];
}

